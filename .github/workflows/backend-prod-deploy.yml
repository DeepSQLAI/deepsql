name: backend-prod-deploy

# Controls when the workflow will run
on:
  workflow_dispatch:

concurrency:
  group: backend-deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if branch is not main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "This workflow should not be triggered on a branch other than main"
          exit 1

      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/deepsqlai/deepsql-backend:latest
            ghcr.io/deepsqlai/deepsql-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/deepsqlai/deepsql-frontend:latest
            ghcr.io/deepsqlai/deepsql-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_USER: ${{ secrets.BACKEND_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $BACKEND_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key $BACKEND_USER@$BACKEND_HOST << EOF
            # Authenticate with ghcr.io to pull latest images
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            cd /opt/dba-agent

            # Pull latest images
            docker compose pull backend frontend

            # Restart with zero-downtime rolling update
            docker compose up -d --remove-orphans

            # Wait for backend health check
            echo "Waiting for backend to become healthy..."
            for i in \$(seq 1 30); do
              if curl -fsS http://localhost:8080/api/actuator/health >/dev/null 2>&1; then
                echo "Backend is healthy."
                break
              fi
              sleep 5
            done

            docker compose ps
          EOF

          rm -f ~/.ssh/deploy_key
