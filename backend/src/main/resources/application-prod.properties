# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.application.name=dba-agent-backend
security.signup.enabled=false
spring.threads.virtual.enabled=true

# Security Configuration - set to false to bypass authentication
security.auth.enabled=true
security.password.enabled=${SECURITY_PASSWORD_ENABLED:true}
security.jwt.secret=${SECURITY_JWT_SECRET:}
# First-user bootstrap. Off by default: the endpoint creates an ADMIN without
# authenticating, so it stays shut unless someone is deliberately installing.
# The placeholder is written out explicitly because this endpoint is the ONLY
# way to create the first account under this profile — signup is disabled above
# and the setup wizard's /setup/initialize is disabled too — so the override
# path must be obvious to anyone reading the file. (An OS environment variable
# outranks a profile properties file in Spring's PropertySource order either
# way; a bare `false` here worked, it just read as un-overridable.)
# install.sh sets this true, bootstraps, then sets it back to false.
# Defence-in-depth regardless: the endpoint also demands a loopback source
# address and a matching X-Admin-Bootstrap-Secret header.
security.admin.bootstrap.enabled=${SECURITY_ADMIN_BOOTSTRAP_ENABLED:false}
security.admin.bootstrap.secret=${ADMIN_BOOTSTRAP_SECRET:}

# Encryption — required in production. Set ENCRYPTION_KEY as an OS env var.
# Spring Boot env vars override application.properties automatically (no wrapper needed).
# Intentionally no default — will throw at startup if unset in prod.
ENCRYPTION_KEY=
ENCRYPTION_KEY_ID=prod-key-1

# PostgreSQL Database Configuration (Credential Vault)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dba_agent?sslmode=disable}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Public URL for invitation emails / signup links — must point at the
# DeepSQL frontend your users actually open in their browser. Invitation
# links are built from this value, so if it is wrong the recipient lands
# on a host that cannot complete their signup. Set APP_PUBLIC_URL for any
# deployment reachable at something other than localhost.
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}

# Base URL for CLI authorize / device-code verification links. The
# `deepsql login` browser flow opens this URL after the CLI POSTs to
# /auth/cli/authorize, and the user's authentication state lands on
# whatever host it names — so it must be YOUR DeepSQL frontend. The
# localhost default is deliberate: a wrong value should fail visibly
# rather than send a terminal session to some other origin.
app.base-url=${APP_BASE_URL:http://localhost:3000}

# CORS Configuration
# Override CORS_ALLOWED_ORIGINS with the origin(s) your frontend is
# actually served from, and keep the loopback patterns: the desktop
# client's SSH tunnel serves the app from http://127.0.0.1:<sticky port>,
# so dropping them rejects every tunnel login with 403 "Invalid CORS
# request". See the longer note in application.properties.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:*,http://localhost:*}

# File upload limits (slow query logs can be large)
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Connection Pool Configuration
# Increased from 50 to 75 to provide safety margin with batch processing + @Transactional
spring.datasource.hikari.maximum-pool-size=75
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Valkey/Redis Cache Configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Logging
logging.level.com.dbaagent=INFO
logging.level.org.springframework.security=DEBUG

# Azure OpenAI Configuration
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
# Chat model (uses Responses API via ResponsesApiChatModel)
azure.openai.chat-deployment=${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-5.4-pro}
# Code/completion model (same model for both)
azure.openai.codex-deployment=${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-5.4-pro}
# Legacy property for backwards compatibility (defaults to chat)
azure.openai.deployment-name=${azure.openai.chat-deployment}
# azure.openai.embedding-deployment removed with the spring.ai.* lines that interpolated it;
# the embedding model comes from the resolved provider bundle (DEEPSQL_EMBEDDING_MODEL / DB).
app.chat.agentic.enabled=${APP_CHAT_AGENTIC_ENABLED:true}
app.chat.agentic.max-steps=${APP_CHAT_AGENTIC_MAX_STEPS:6}
# Prod stays fail-closed: a silently empty vector degrades retrieval with no error, which
# is harder to notice in production than a failed request. Preserves the previous
# azure.openai.embedding.fail-open=false behaviour under the provider-agnostic name.
app.embedding.fail-open=${EMBEDDING_FAIL_OPEN:false}

# Azure AI Search Configuration for RAG
azure.search.endpoint=${AZURE_SEARCH_ENDPOINT:}
azure.search.api-key=${AZURE_SEARCH_API_KEY:}
azure.search.index-name=${AZURE_SEARCH_INDEX_NAME:deepsql-training-data}
azure.search.enabled=${AZURE_SEARCH_ENABLED:true}

# Vector Store — set to 'pgvector' for self-hosted deployments (no Azure needed)
vector.store.type=${VECTOR_STORE_TYPE:azure}
vector.store.embedding-dimensions=${VECTOR_STORE_EMBEDDING_DIMENSIONS:3072}

# Chat memory and schema context controls
app.chat.memory.max-messages=50
app.chat.memory.expected-max-messages=50
app.chat.memory.verify-window-on-startup=true
app.chat.memory.fail-fast-on-window-mismatch=false
app.chat.schema-context.full-max-tables=50
app.chat.schema-context.preview-max-tables=20
app.chat.schema-context.preview-max-columns-per-table=8
app.chat.sql-fix.max-attempts=3
app.chat.auto-learn-feedback.enabled=true
app.chat.auto-learn.max-feedback-context-chars=4000
app.chat.rag.general-top-k=20
app.chat.rag.intent-top-k=25

# Training history retention
training.history.retention.max-per-connection=50
training.history.retention.days=0
training.history.cleanup.cron=0 30 2 * * *

# Growth Monitoring Configuration
growth-monitoring.enabled=true
growth-monitoring.retention-days=90

# OpenTelemetry Tracing Configuration
management.tracing.export.enabled=false
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Disable OTLP metrics to avoid protobuf dependency issues
management.otlp.metrics.export.enabled=false
management.metrics.export.otlp.enabled=false

# Actuator — prod: expose health (+ optional authenticated metrics). Never show details anonymously.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=false

# Email Configuration for Growth Monitoring Alerts
# Configure with environment variables or override in production
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
dba-agent.email.from=${EMAIL_FROM:noreply@dba-agent.com}

# Disable mail health check when SMTP is not configured
management.health.mail.enabled=false

# Brain understanding defaults
brain.profile.max-columns-per-table=40
brain.profile.max-tables=50
brain.profile.max-rowcount=1000000
brain.score.snapshot.min-interval-minutes=60
brain.score.snapshot.min-delta=1
brain.usage.lookback-days=90
brain.history.limit=20
analysis.history.max-batch=1000
db.fetch-size=1000
db.query-timeout-seconds=30

# Key column analysis configuration
brain.key-columns.weight.join=3
brain.key-columns.weight.where=2
brain.key-columns.weight.group-by=2
brain.key-columns.weight.order-by=1
brain.key-columns.lookback-days=90

# Slow query log parsing and lineage recording
slow-query.log.max-parsed=10000
slow-query.log.max-top=200
slow-query.log.max-bytes=524288000
slow-query.log.temp-dir=/tmp/dba-agent
slow-query.log.min-free-disk-mb=1024
slow-query.history.lookback-days=90
slow-query.history.max-batch=1000
slow-query.lineage.max-per-analysis=500
slow-query.lineage.batch-size=200
slow-query.lineage.backfill.enabled=true
slow-query.lineage.backfill.cron=0 15 2 * * *
slow-query.lineage.backfill.history-limit=50
slow-query.log.source.poll-ms=900000
