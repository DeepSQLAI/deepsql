# Server Configuration
server.port=8080
server.servlet.context-path=/api
# Surface the real exception message in error responses. Self-host operators
# own the box; the Spring default (include-message=never) returns a bare,
# bodyless 500 that hides actionable causes like "column ... does not exist"
# and turns a one-line schema-drift diagnosis into a log-spelunking exercise.
server.error.include-message=always
spring.application.name=dba-agent-backend
security.signup.enabled=false
security.signup.invite-only=true
spring.threads.virtual.enabled=true

# Security Configuration
# Keep real authentication enabled by default so local multi-user access control
# matches production behavior. Override with SECURITY_AUTH_ENABLED=false only
# for explicit single-user bypass scenarios.
security.auth.enabled=${SECURITY_AUTH_ENABLED:true}
security.admin-mfa.enabled=${SECURITY_ADMIN_MFA_ENABLED:false}
security.jwt.secret=${SECURITY_JWT_SECRET:}
security.admin.bootstrap.enabled=${SECURITY_ADMIN_BOOTSTRAP_ENABLED:false}
security.admin.bootstrap.secret=${ADMIN_BOOTSTRAP_SECRET:}
security.session.access-minutes=${SECURITY_SESSION_ACCESS_MINUTES:15}
security.session.refresh-days=${SECURITY_SESSION_REFRESH_DAYS:7}
security.cookie.name=${SECURITY_COOKIE_NAME:auth_token}
security.cookie.refresh-name=${SECURITY_COOKIE_REFRESH_NAME:refresh_token}
security.cookie.same-site=${SECURITY_COOKIE_SAME_SITE:Lax}
security.cookie.secure=${SECURITY_COOKIE_SECURE:false}
security.otp.ttl-minutes=${SECURITY_OTP_TTL_MINUTES:10}
security.otp.max-attempts=${SECURITY_OTP_MAX_ATTEMPTS:5}
security.auth.rate-limit-enabled=${SECURITY_AUTH_RATE_LIMIT_ENABLED:true}
security.auth.skip-2fa=${SECURITY_AUTH_SKIP_2FA:false}
security.auth.rate-limit-window-minutes=${SECURITY_AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
security.auth.max-email-starts=${SECURITY_AUTH_MAX_EMAIL_STARTS:5}
security.auth.max-ip-starts=${SECURITY_AUTH_MAX_IP_STARTS:20}
security.invite.ttl-hours=${SECURITY_INVITE_TTL_HOURS:48}
security.bootstrap.ttl-minutes=${SECURITY_BOOTSTRAP_TTL_MINUTES:30}
security.google.enabled=${SECURITY_GOOGLE_ENABLED:false}
security.google.client-id=${SECURITY_GOOGLE_CLIENT_ID:}
security.google.client-secret=${SECURITY_GOOGLE_CLIENT_SECRET:}
security.google.redirect-uri=${SECURITY_GOOGLE_REDIRECT_URI:}
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.public-issuer=${APP_PUBLIC_ISSUER:DeepSQL}

# Encryption — no baked-in default. ENCRYPTION_KEYS is real key material and must be
# supplied via environment for local dev from now on (e.g. export ENCRYPTION_KEYS=...).
# Override the active key in production via ENCRYPTION_KEY / ENCRYPTION_KEY_ID.
ENCRYPTION_KEYS=${ENCRYPTION_KEYS:}
ENCRYPTION_KEY_ID=local-2025-01

# PostgreSQL Database Configuration (Credential Vault)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dba_agent?sslmode=disable}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Allow startup to proceed even if an index/constraint already exists in the DB
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false


# Spring Batch Configuration
# Schema initialized by BatchSchemaInitializer.java (single source of truth)
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.table-prefix=DBA_BATCH_
spring.batch.job.enabled=false

# db-scheduler Configuration (distributed task scheduling)
db-scheduler.enabled=true
# The revival window for an execution whose owner died is
# heartbeat-interval × missed-heartbeats-limit. At the old 5m × 6 that was THIRTY
# MINUTES, during which a dead brain-init stage sits at a frozen percentage with no
# error: the status endpoint keeps reporting the last stage it reached, so it is
# indistinguishable from slow progress. smoke-test.sh gives up after 1200s (20m),
# so any run where a stage died failed the smoke test even though init would have
# completed fine once revived — observed exactly that, init finishing ~37m after
# revival.
#
# 1m × 6 keeps the same six-missed-heartbeat tolerance — a live-but-slow execution
# heartbeats from its own thread, so a long LLM call is never mistaken for death —
# while bringing revival to ~6m, comfortably inside the smoke-test window.
db-scheduler.heartbeat-interval=1m
db-scheduler.missed-heartbeats-limit=6
db-scheduler.polling-interval=10s
db-scheduler.polling-strategy=fetch
db-scheduler.table-name=scheduled_tasks
db-scheduler.threads=10
db-scheduler.shutdown-max-wait=45m
db-scheduler.immediate-execution-enabled=true

# CORS Configuration
# Localhost only by default so `mvn spring-boot:run` + `npm run dev` works out of the box.
# Any deployment serving a browser from another host must set CORS_ALLOWED_ORIGINS.
# Note: exact origins (no patterns) for reliability.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002}

# File upload limits (slow query logs can be large)
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Connection Pool Configuration
# Increased from 50 to 75 to provide safety margin with batch processing + @Transactional
spring.datasource.hikari.maximum-pool-size=75
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Valkey/Redis Cache Configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Logging
logging.level.com.dbaagent=INFO
logging.level.org.springframework.security=INFO

# Azure OpenAI Configuration
# No baked-in default — set AZURE_OPENAI_KEY / AZURE_OPENAI_ENDPOINT via env or the setup wizard.
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
# Chat model for conversational AI (chat completions API)
azure.openai.chat-deployment=${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-5.4}
# Code/completion model for code generation tasks
azure.openai.codex-deployment=${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-5.4-pro}
# Legacy property for backwards compatibility (defaults to chat)
azure.openai.deployment-name=${azure.openai.chat-deployment}
# azure.openai.embedding-deployment is gone: the four spring.ai.* lines that interpolated it
# were the only readers, and no @Value binds it. The embedding model is now named by the
# resolved provider bundle (DB config, or DEEPSQL_EMBEDDING_MODEL).
# Embedding behaviour — provider-agnostic, read by EmbeddingService. The provider itself
# (endpoint, key, model) is resolved by LlmConfigResolver from the DB or DEEPSQL_EMBEDDING_*
# env vars, never from this file.
# Fail-open returns an empty vector instead of propagating, degrading retrieval rather than
# failing the request. The failure is always logged with provider, model and error category.
app.embedding.max-chars=30000
app.embedding.fail-open=${EMBEDDING_FAIL_OPEN:true}
app.chat.agentic.enabled=${APP_CHAT_AGENTIC_ENABLED:true}
app.chat.agentic.max-steps=${APP_CHAT_AGENTIC_MAX_STEPS:6}

# Azure AI Search Configuration for RAG
# No baked-in default — set AZURE_SEARCH_ENDPOINT / AZURE_SEARCH_API_KEY via env or the setup wizard.
azure.search.endpoint=${AZURE_SEARCH_ENDPOINT:}
azure.search.api-key=${AZURE_SEARCH_API_KEY:}
azure.search.index-name=${AZURE_SEARCH_INDEX_NAME:deepsql-training-data}
azure.search.enabled=${AZURE_SEARCH_ENABLED:true}

# Vector Store — set to 'pgvector' for self-hosted deployments (no Azure needed)
# Options: azure (default), pgvector
vector.store.type=${VECTOR_STORE_TYPE:azure}
vector.store.embedding-dimensions=${VECTOR_STORE_EMBEDDING_DIMENSIONS:3072}

# ============================================================================
# Spring AI Configuration
# ============================================================================

# Spring AI - JDBC Chat Memory Repository (V59 widens conversation_id to VARCHAR(255))
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
# Chat memory window controls (kept in sync with MessageWindowChatMemory)
app.chat.memory.max-messages=50
app.chat.memory.expected-max-messages=50
app.chat.memory.verify-window-on-startup=true
app.chat.memory.fail-fast-on-window-mismatch=false

# Spring AI - every OpenAI model auto-configuration is EXCLUDED in DbaAgentApplication.
# ChatModel and EmbeddingModel are both supplied by LlmConfig, which resolves provider and
# credentials per call through LlmConfigResolver. There is deliberately no spring.ai.openai.*
# or spring.ai.azure.openai.* block here any more: those were two further, independently
# configured embedding sources feeding the same vector index as EmbeddingService, and a
# store written by one embedding model and read through another fails silently.

# Responses API configuration (for chat/codex via ResponsesApiChatModel)
azure.openai.responses-api-version=2025-03-01-preview
azure.openai.use-responses-api=${AZURE_OPENAI_USE_RESPONSES_API:true}
azure.openai.chat-temperature=1.0

# Spring AI - Azure Vector Store (uses existing index)
spring.ai.vectorstore.azure.url=${azure.search.endpoint}
spring.ai.vectorstore.azure.api-key=${azure.search.api-key}
spring.ai.vectorstore.azure.index-name=${azure.search.index-name}
spring.ai.vectorstore.azure.initialize-schema=false
spring.ai.vectorstore.azure.default-top-k=30
spring.ai.vectorstore.azure.default-similarity-threshold=0.6
# Field name mappings for existing Azure AI Search index
spring.ai.vectorstore.azure.content-field-name=content
spring.ai.vectorstore.azure.embedding-field-name=contentVector
spring.ai.vectorstore.azure.metadata-field-name=metadata

# Spring AI RAG Configuration
spring.ai.rag.top-k=30
spring.ai.rag.similarity-threshold=0.6
# QuestionAnswerAdvisor: When enabled, uses Spring AI's automatic RAG alongside manual RAG
# Set to true to enable A/B comparison between manual RAG and QuestionAnswerAdvisor
spring.ai.rag.advisor.enabled=false
# When true, runs both RAG approaches and logs comparison (for testing)
spring.ai.rag.advisor.comparison-mode=false
# Schema context sizing controls for large databases
app.chat.schema-context.full-max-tables=100
app.chat.schema-context.preview-max-tables=100
app.chat.schema-context.preview-max-columns-per-table=8
# SQL correction and auto-learning controls
app.chat.sql-fix.max-attempts=3
app.chat.auto-learn-feedback.enabled=true
app.chat.auto-learn.max-feedback-context-chars=4000
app.chat.feedback.recency-days=90
app.chat.rag.general-top-k=20
app.chat.rag.intent-top-k=25
app.chat.max-system-prompt-tokens=64000

# Multi-Step Query Generation Pipeline
app.pipeline.enabled=true
app.pipeline.history-match-threshold=0.92
app.pipeline.column-values.max-per-column=50
app.pipeline.column-values.max-columns=10
app.pipeline.column-values.timeout-ms=3000
app.pipeline.explain-validation.enabled=true
app.pipeline.explain-validation.timeout-ms=5000

# Column value collection configuration
spring.ai.column-values.low-cardinality-threshold=100
spring.ai.column-values.sample-size=20
spring.ai.column-values.background-sampling.enabled=true
spring.ai.column-values.background-sampling.cron=0 0 3 * * *
brain.init.refresh.enabled=true
brain.init.refresh.interval-hours=24
brain.init.refresh.cron=0 30 2 * * *

# Column values RAG embedding — max distinct count to include in embeddings
training.column-values.cardinality-threshold=50

# Training history retention
training.history.retention.max-per-connection=50
training.history.retention.days=0
training.history.cleanup.cron=0 30 2 * * *

# Security / user-log retention (security_event, user_session, auth_login_challenge)
security.audit.retention-days=30

# Growth Monitoring Configuration
growth-monitoring.enabled=true
growth-monitoring.retention-days=90

# OpenTelemetry Tracing Configuration
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Disable OTLP metrics to avoid protobuf dependency issues
management.otlp.metrics.export.enabled=false
management.metrics.export.otlp.enabled=false

# Spring AI Observability Configuration
# Enable detailed observability for AI operations (chat, embedding, vector store)
# These are automatically integrated with OpenTelemetry tracing
spring.ai.chat.observations.include-error-logging=true
# Log prompt/completion content in dev (disable in production for privacy)
spring.ai.chat.observations.log-prompt=${SPRING_AI_LOG_PROMPTS:false}
spring.ai.chat.observations.log-completion=${SPRING_AI_LOG_COMPLETIONS:false}

# Spring AI Retry Configuration
# Automatic retry with exponential backoff for transient failures
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000ms
spring.ai.retry.backoff.max-interval=10000ms
spring.ai.retry.backoff.multiplier=2
# Retry on rate limit (429) and server errors (500, 502, 503, 504)
spring.ai.retry.on-http-codes=429,500,502,503,504
# Don't retry on client errors (4xx) except rate limit
spring.ai.retry.on-client-errors=false

# No spring.ai.openai.connect-timeout / read-timeout: they bind to OpenAiConnectionProperties,
# which only the excluded OpenAI auto-configurations instantiate. Provider timeouts now live
# with the provider (OpenAiCompatibleEmbeddingProvider / OpenAiCompatibleChatProvider); a knob
# here would read as if it still controlled them.

# Actuator Endpoints - Expose metrics for monitoring
management.endpoints.web.exposure.include=health,info,metrics,caches,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Email Configuration for Growth Monitoring Alerts
# Configure with environment variables or override in production
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
dba-agent.email.from=${EMAIL_FROM:noreply@dba-agent.com}

# Disable mail health check when SMTP is not configured
management.health.mail.enabled=false

# Slack Socket Mode bot configuration
slack.enabled=${SLACK_ENABLED:false}
slack.socket-mode-enabled=${SLACK_SOCKET_MODE_ENABLED:false}
slack.app-token=${SLACK_APP_TOKEN:}
slack.bot-token=${SLACK_BOT_TOKEN:}
slack.signing-secret=${SLACK_SIGNING_SECRET:}
slack.deepsql-bot-username=${SLACK_DEEPSQL_BOT_USERNAME:}
slack.daily-digest.cron=${SLACK_DAILY_DIGEST_CRON:0 0 9 * * *}

# Brain understanding defaults
brain.profile.max-columns-per-table=40
brain.profile.max-tables=50
brain.profile.max-rowcount=1000000
brain.score.snapshot.min-interval-minutes=60
brain.score.snapshot.min-delta=1
brain.usage.lookback-days=90
brain.history.limit=20
brain.description.ai-concurrency=8
analysis.history.max-batch=1000
db.fetch-size=1000
db.query-timeout-seconds=30

# optd sidecar
optd.enabled=true
optd.sidecar.base-url=http://localhost:8088
optd.request-timeout-ms=8000

# Key column analysis configuration
brain.key-columns.weight.join=3
brain.key-columns.weight.where=2
brain.key-columns.weight.group-by=2
brain.key-columns.weight.order-by=1
brain.key-columns.lookback-days=90

# Slow query log parsing and lineage recording
slow-query.log.max-parsed=10000
slow-query.log.max-top=200
slow-query.log.max-bytes=524288000
slow-query.log.temp-dir=
slow-query.log.min-free-disk-mb=1024
slow-query.history.lookback-days=90
slow-query.history.max-batch=1000
slow-query.lineage.max-per-analysis=500
slow-query.lineage.batch-size=200
slow-query.lineage.backfill.enabled=true
slow-query.lineage.backfill.cron=0 15 2 * * *
slow-query.lineage.backfill.history-limit=50
slow-query.log.source.poll-ms=900000
