# PostgreSQL Database Configuration (same as main app)
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/dba_agent?sslmode=disable}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Override production pool sizes for tests - 75 connections is way too much
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000

# Flyway configuration - run migrations on test startup
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

cors.allowed.origins=http://localhost
# No baked-in default — real key material. Supply via environment (see CLAUDE.md).
ENCRYPTION_KEYS=${ENCRYPTION_KEYS:}
ENCRYPTION_KEY_ID=local-2025-01
spring.cache.type=none
security.jwt.secret=${SECURITY_JWT_SECRET:test-jwt-secret-please-change-1234567890}
server.servlet.context-path=/api

# Integration tests build MockMvc with webAppContextSetup and no authenticated
# principal, so with auth on, AccessControlService denies every connection-scoped
# request with 403 before the controller under test ever runs. Tests that are ABOUT
# authorization opt back in per class with
# @SpringBootTest(properties = "security.auth.enabled=true") — see
# McpTokenControllerSecurityTest, AuthCliControllerSecurityTest,
# McpTokenConnectionRegressionTest and SecurityConfigCorsTest. Those overrides are
# what make this a safe default rather than a blanket weakening: opting in is
# explicit, so a security test cannot silently inherit a disabled check.
security.auth.enabled=false

# Brain understanding defaults
brain.profile.max-columns-per-table=10
brain.profile.max-tables=10
brain.profile.max-rowcount=100000
brain.score.snapshot.min-interval-minutes=0
brain.score.snapshot.min-delta=0
brain.usage.lookback-days=30
brain.history.limit=5

# Training history retention
training.history.retention.max-per-connection=50
training.history.retention.days=0
training.history.cleanup.cron=0 30 2 * * *

# Test connection ID. Intentionally has NO default: integration tests that need a
# live connection must be given one explicitly via TEST_CONNECTION_ID, and should
# skip loudly rather than silently target someone else's connection row.
test.connection.id=${TEST_CONNECTION_ID:}

# Disable unnecessary features for tests
spring.mail.host=
spring.mail.username=
management.health.mail.enabled=false
spring.task.scheduling.enabled=false

# Disable db-scheduler task execution during tests (beans still created for DI)
db-scheduler.polling-interval=PT999999S
db-scheduler.immediate-execution-enabled=false

# Disable tracing export in tests to avoid OTLP connection noise/failures
management.tracing.enabled=false
management.tracing.export.enabled=false
management.tracing.sampling.probability=0.0
management.opentelemetry.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:0/v1/traces

# Disable OTLP metrics to avoid protobuf dependency issues
management.otlp.metrics.export.enabled=false
management.metrics.export.otlp.enabled=false

# Azure OpenAI configuration for tests.
# No baked-in key default; supply AZURE_OPENAI_KEY via environment for tests that
# actually call the live endpoint (they must assumeTrue/skip when it's absent — do not
# reintroduce a literal default here). The endpoint is a placeholder host that resolves
# nowhere on purpose: a test that reaches the network is a test talking to somebody's
# production, which is exactly how this file used to "pass".
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://openai.example.invalid/}
azure.openai.chat-deployment=gpt-5.4
azure.openai.codex-deployment=gpt-5.4
azure.openai.deployment-name=${azure.openai.chat-deployment}
# azure.openai.embedding-deployment removed with the spring.ai.* lines that interpolated it.
azure.openai.use-responses-api=true

# No spring.ai.openai.* block: every OpenAI model auto-configuration is excluded in
# DbaAgentApplication, and ChatModel/EmbeddingModel come from LlmConfig. Reintroducing it
# would give the test context a second embedding source and hide exactly the divergence
# EmbeddingSurfaceConsistencyTest exists to catch.

# Azure AI Search configuration.
#
# Disabled outright for tests, and the vector store is pinned to pgvector — the same
# combination scripts/self-host/install.sh applies at runtime. Two reasons, both hard
# requirements:
#   1. With azure.search.api-key blanked (no credential defaults in this repo),
#      AzureVectorStoreAutoConfiguration builds searchIndexClient eagerly and fails
#      context refresh with "'key' cannot be empty".
#   2. Supplying a dummy key only moves the failure: the client then tries to reach the
#      configured host. Every @SpringBootTest used to pass by talking to a live Azure AI
#      Search instance. A unit-test context must never open a socket to anybody's
#      production.
# The placeholder host below is unroutable on purpose; override via env if you really
# intend to exercise the live path.
azure.search.endpoint=${AZURE_SEARCH_ENDPOINT:https://search.example.invalid}
# No baked-in key default; supply AZURE_SEARCH_API_KEY via environment for tests that
# actually call the live endpoint (they must assumeTrue/skip when it's absent).
azure.search.api-key=${AZURE_SEARCH_API_KEY:}
azure.search.index-name=${AZURE_SEARCH_INDEX_NAME:deepsql-training-data}
azure.search.enabled=false
vector.store.type=pgvector

# Belt and braces alongside azure.search.enabled=false: the auto-configuration is keyed
# off spring.ai.vectorstore.azure.*, not off our own flag, so excluding it is what
# actually keeps searchIndexClient from being built.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.azure.autoconfigure.AzureVectorStoreAutoConfiguration
