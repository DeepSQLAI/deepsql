# DeepSQL Agent profile distribution (runs on the Nous Hermes Agent profile CLI).
# Enterprises install this per user:  hermes profile install <git-url|dir> --name <profile>
# `hermes profile update <profile>` refreshes SOUL.md + skills/ WITHOUT touching
# the user's memory, sessions, .env, or config.yaml (their identity + history).
# `hermes_requires` is an upstream schema key — do not rename it.
name: deepsql-agent
version: 0.1.0
description: "DeepSQL DBA agent — grounded, read-only database assistant over the DeepSQL MCP tools (BI queries, schema exploration, index advice, slow-query optimization, workload analysis)."
# 2026-08-07: the previous ceiling of <0.20.0 was WRONG and has been removed.
# It claimed 0.20.0 was verified-incompatible because every API call answered
# 401 {"detail":"Unauthorized","reason":"no_cookie"}. That verification was invalid:
# it came from a hand-rolled native run started with `hermes serve` bound to
# 127.0.0.1 rather than `hermes webui` as setup-agent.sh actually starts it, and the
# 401s came from the tester's own curl, not from the backend.
#
# Re-verified on 2026-08-07 against hermes-agent 0.20.0 as installed by
# scripts/self-host/setup-agent.sh: profile switch, session creation, SSE streaming
# and MCP tool calls all succeed and a full turn completes
# (e2e-agent-check.py -> AGENT_OK True, DASH_OK True).
#
# What actually broke the agent was never the hermes version — it was the unpinned
# Python MCP SDK. 2.0.0 renamed CallToolResult.isError to .is_error, so every tool
# call raised AttributeError. That is now pinned in setup-agent.sh (mcp>=1.0,<2).
#
# The floor stays at 0.12.0 because nothing below it has been tested; that is not a
# claim that 0.12.0 works.
hermes_requires: ">=0.12.0"
author: "DeepSQL"
license: "proprietary"

# Per-user runtime values. Secrets + identity live in each profile's .env
# (user-owned, preserved on update); provision-profile.sh writes them.
env_requires:
  - name: AZURE_OPENAI_KEY
    description: "Azure OpenAI API key for the chat model"
    required: true
  - name: AZURE_OPENAI_ENDPOINT
    description: "Azure OpenAI resource endpoint (…cognitiveservices/…openai.azure.com)"
    required: false
    default: "https://your-resource.openai.azure.com/"
  - name: DEEPSQL_API_BASE_URL
    description: "DeepSQL backend API base URL"
    required: false
    default: "http://localhost:8080/api/"
  - name: DEEPSQL_MCP_SERVER
    description: "Absolute path to mcp/deepsql-phase1-server.js"
    required: true
  - name: DEEPSQL_MCP_USER_ID
    description: "DeepSQL user id this profile acts as — backend audit + RBAC attribution"
    required: true
  - name: DEEPSQL_AUTH_TOKEN
    description: "DeepSQL bearer token for this user — server-enforced RBAC/connection-scope"
    required: false

# The agent persona and skills are the distribution's product surface.
# Runtime config (model, mcp_servers, approvals, toolset scoping) is applied
# per-user by provision-profile.sh into the profile's preserved config.yaml.
distribution_owned:
  - SOUL.md
  - skills/
